name: CI

on:
  push:
    branches: [mainline]
  pull_request:
    branches: [mainline]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: CI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      BUILD_TOOLS_VERSION: '36.1.0' # must equal buildToolsVersion in app/build.gradle.kts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '15859902' # Command-line Tools 22.0, understands API 37.0 packages
          packages: '' # Install only the explicit SDK packages below
      - name: Install pinned Android SDK packages
        run: sdkmanager 'platforms;android-37.0' "build-tools;$BUILD_TOOLS_VERSION"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true
      - name: Check current source publication policy
        run: |
          python3 -B tools/release/publication_check.py --source worktree
          python3 -B tools/release/publication_check.py --source index
      - name: Test release helpers
        run: python3 -m unittest discover -s tools/release/tests -v
      - name: Check both build variants without release credentials
        run: |
          ./gradlew --no-daemon --max-workers=2 -PsplitfreeUnsignedRelease=true \
            spotlessCheck :app:testDebugUnitTest :app:lintDebug :app:lintRelease \
            :app:assembleDebug :app:assembleRelease
      - name: Verify compiled variant isolation
        env:
          SPLITFREE_VARIANT_BUILD_DIR: app/build
        run: |
          AAPT2="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2" \
            python3 -B -m unittest discover -s tools/release/tests -p test_variants.py -v
      - name: Retain test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*.xml
            app/build/reports/lint-results-*.html
          retention-days: 14
          if-no-files-found: warn
