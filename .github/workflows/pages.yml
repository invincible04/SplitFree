name: Website · GitHub Pages

on:
  push:
    branches: [mainline]
  pull_request:
    branches: [mainline]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Build and check website
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install test tools
        run: npm ci --ignore-scripts
      - name: Install test browsers
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Refresh bundled release from the public GitHub API
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/mainline' && github.repository == 'invincible04/SplitFree'
        run: npm run sync:release
      - name: Check formatting, unit tests, static build and browser tests
        run: npm run check
      - name: Check source publication policy
        working-directory: .
        run: python3 -B tools/release/publication_check.py --source worktree
      - name: Test website publication and workflow rules
        working-directory: .
        run: |
          python3 -B -m unittest discover -s tools/release/tests -p test_website_policy.py -v
          python3 -B -m unittest discover -s tools/release/tests -p test_workflow.py -v
      - name: Retain browser reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: website-browser-reports
          path: website/playwright-report/
          retention-days: 7
      - name: Archive only the static website
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/mainline' && github.repository == 'invincible04/SplitFree'
        run: tar --dereference --hard-dereference --directory dist -cf "$RUNNER_TEMP/artifact.tar" .
      - name: Upload Pages archive
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/mainline' && github.repository == 'invincible04/SplitFree'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy GitHub Pages
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/mainline' && github.repository == 'invincible04/SplitFree'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy reviewed static artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
